<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Mô Phỏng 2 Thẻ DHTN (Chờ cấp số & Chờ tiếp nhận)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 680px;
      margin: 30px auto;
      padding: 24px;
      background: #f1f5f9;
      color: #334155;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #b91c1c;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p.desc {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .widgets-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    /* Giao diện chuẩn như ảnh scr.png */
    .widget-box {
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .widget-box.vb-di {
      background-color: #ebf3fe; /* Xanh nhạt */
    }
    .widget-box.vb-den {
      background-color: #fef0ef; /* Hồng/đỏ nhạt */
    }
    .widget-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      flex-shrink: 0;
    }
    .widget-box.vb-di .widget-icon {
      background-color: #2563eb; /* Xanh dương */
    }
    .widget-box.vb-den .widget-icon {
      background-color: #991b1b; /* Đỏ đậm */
    }
    .widget-info {
      display: flex;
      flex-direction: column;
    }
    .widget-label {
      font-size: 13px;
      color: #1e293b;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .z-label.count-number {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.2;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      background: #b91c1c;
      color: white;
      transition: background 0.2s;
    }
    button:hover {
      background: #991b1b;
    }
    button.btn-blue {
      background: #2563eb;
    }
    button.btn-blue:hover {
      background: #1d4ed8;
    }
    button.btn-gray {
      background: #64748b;
    }
    button.btn-gray:hover {
      background: #475569;
    }
    .logs {
      background: #0f172a;
      color: #38bdf8;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      max-height: 140px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📑 Mô Phỏng Chuẩn Theo Ảnh scr.png</h1>
    <p class="desc">
      Giao diện 2 widget mô phỏng đúng kích thước và cấu trúc của cổng DHTN:
    </p>

    <div class="widgets-container">
      <!-- Widget 1: Văn bản đi > Chờ cấp số -->
      <div class="widget-box vb-di">
        <div class="widget-icon">⏱️</div>
        <div class="widget-info">
          <span class="widget-label">Chờ cấp số</span>
          <span class="z-label count-number" id="countCapSo">0</span>
        </div>
      </div>

      <!-- Widget 2: Văn bản đến > Chờ tiếp nhận -->
      <div class="widget-box vb-den">
        <div class="widget-icon">⏱️</div>
        <div class="widget-info">
          <span class="widget-label">Chờ tiếp nhận</span>
          <span class="z-label count-number" id="countTiepNhan">2</span>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-blue" onclick="changeCount('countCapSo', 1)">+1 Chờ cấp số</button>
      <button onclick="changeCount('countTiepNhan', 1)">+1 Chờ tiếp nhận</button>
      <button class="btn-gray" onclick="resetAll()">Đặt tất cả về 0</button>
    </div>

    <p style="font-size: 13px; margin-bottom: 8px;"><b>Nhật ký test:</b></p>
    <div class="logs" id="logs">Sẵn sàng... Extension sẽ chỉ bắt 2 thẻ này.</div>
  </div>

  <script>
    const elCapSo = document.getElementById('countCapSo');
    const elTiepNhan = document.getElementById('countTiepNhan');
    const logsEl = document.getElementById('logs');

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logsEl.innerHTML = `[${time}] ${msg}<br>` + logsEl.innerHTML;
    }

    function changeCount(id, delta) {
      const el = document.getElementById(id);
      const cur = parseInt(el.textContent, 10) || 0;
      const next = Math.max(0, cur + delta);
      el.textContent = next;
      const name = id === 'countCapSo' ? 'Chờ cấp số' : 'Chờ tiếp nhận';
      log(`Đổi <b>${name}</b>: ${cur} ➔ <b>${next}</b>`);
    }

    function resetAll() {
      elCapSo.textContent = '0';
      elTiepNhan.textContent = '0';
      log('Đã reset tất cả về <b>0</b>.');
    }
  </script>
</body>
</html>
